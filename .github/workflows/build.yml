name: Build Windows Client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe with PyInstaller
        working-directory: client/src
        run: pyinstaller --noconfirm --clean ..\scripts\ServerMonitor.spec

      - name: Verify artifact
        working-directory: client/src/dist/ServerMonitor
        run: dir ServerMonitor.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerMonitor-windows
          path: client/src/dist/ServerMonitor/
          retention-days: 30

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: client/src/dist/ServerMonitor
        run: Compress-Archive -Path * -DestinationPath ServerMonitor.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: client/src/dist/ServerMonitor/ServerMonitor.zip
          name: ServerMonitor v${{ github.ref_name }}
          draft: false
